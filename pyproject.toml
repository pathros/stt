[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stt"
version = "0.1.0"
description = "Speech-to-Text CLI based on Faster Whisper"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "faster-whisper>=1.2.1",
    # PyAV 19 quitó metadata_errors y faster-whisper 1.2.1 todavía lo envía.
    "av>=11,<19",
    "yt-dlp>=2026.7.4",
    "youtube-transcript-api>=1.2.4",
    "rich>=15.0.0",
    "prompt_toolkit>=3.0.52",
    "PyYAML>=6.0.3",
    "edge-tts>=7.0.0",
    "python-docx>=1.1.2",
]

# Requisito de sistema (no instalable vía pip):
#   ffmpeg  ->  brew install ffmpeg
#   yt-dlp usa ffmpeg para extraer y normalizar audio.
#   edge-tts (motor de podcast opcional) usa las voces neuronales en línea
#   de Microsoft Edge; requiere conexión a internet, sin API key.

[project.scripts]
stt = "stt.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
