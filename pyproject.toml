[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stt"
version = "0.1.0"
description = "Speech-to-Text CLI based on Faster Whisper"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "faster-whisper",
    "rich",
    "prompt_toolkit",
]

[project.scripts]
stt = "stt.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
